[project]
name = "equity-research-framework"
version = "0.1.0"
description = "Public-equity company coverage system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "python-dateutil>=2.9.0.post0",
    "rich>=15.0.0",
    "typer>=0.24.2",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
]

[project.scripts]
eqos = "equity_os.v1_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
